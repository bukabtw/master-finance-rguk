{% extends 'base.html' %}
{% block title %}Страница не найдена{% endblock %}
{% block content %}
<section class="main-section" style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="text-align: center; padding: 40px; background: rgba(103, 116, 142, 0.6); backdrop-filter: blur(8px); border-radius: 16px;">
        <h1 style="font-size: 80px; margin: 0; color: #00c2ff;">404</h1>
        <h2 style="color: white;">Страница не найдена</h2>
        <p style="color: white; font-size: 18px;">К сожалению, запрашиваемая вами страница не существует.</p>
        <a href="{% url 'index' %}" class="main-button" style="display: inline-block; margin-top: 20px; min-width: 200px; font-size: 18px;">На главную</a>
    </div>
</section>
{% endblock %}
